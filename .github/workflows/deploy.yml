name: Deploy DataLaget

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir deploy
          cp *.html *.js *.css deploy/
          cp -r bilder ljud deploy/

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload via SFTP
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SSHPASS:-}" ]]; then
            echo 'SFTP_PASSWORD secret is missing or empty.' >&2
            exit 1
          fi
          sftp_batch=$(mktemp)
          trap 'rm -f "$sftp_batch"' EXIT
          printf '%s\n' \
            'lcd deploy' \
            'cd /ludd/www/linus69420/htdocs/DataLaget/' \
            'put -r *' > "$sftp_batch"
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -b "$sftp_batch" \
            -P 22 "linus69420@ssh.ludd.ltu.se"