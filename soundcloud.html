<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundcloud - Datalaget</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="bilder/data-d.png">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <div class="logo-section">
                <a href="index.html">
                    <img src="bilder/logo.png" alt="Datalaget Logo" class="main-logo">
                </a>
                <div class="site-title">
                    <h1><a href="index.html">Datalaget</a></h1>
                    <h6>Störst, bäst och vackrast men framförallt ödmjukast</h6>
                </div>
            </div>
            <nav class="main-nav">
                <div class="mantel-dropdown">
                    <div class="nav-icon" tabindex="0">
                        <span>Mantel</span>
                        <img src="bilder/data-d.png" alt="data-d" width="100" height="100">
                    </div>
                    <ul class="nav-links">
                        <li><a href="arbetare.html">Mantelbärare</a></li>
                        <li><a href="soundcloud.html">Soundcloud</a></li>
                        <li><a href="https://docs.google.com/forms/d/e/1FAIpQLSeu9iYtV5-QYzNFaPluN934z_IgpMClk-NdvaX-Vu9oOt-Uog/viewform">Joina Capscirkeln</a></li>
                        <li><a href="inlogg.html">Logga In</a></li>
                        <li><a href="https://www.instagram.com/datalaget/">Instagram</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="welcome-section">
            <h1>Soundcloud</h1>
        </section>

        <section class="soundcloud-box">
            <div class="soundcloud-list">
                <div class="soundcloud-player">
                    <iframe
                        title="Soundcloud-spelare 1"
                        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Fplaylists%2Fsoundcloud%253Aplaylists%253A1408797547&auto_play=false&show_artwork=true&visual=true&origin=iframely&color=%23992222"
                        allow="autoplay"
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="soundcloud-player">
                    <iframe
                        title="Soundcloud-spelare 2"
                        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fmarcus_songsong%2Fsets%2Fgott-och-blandat&auto_play=false&show_artwork=true&visual=true&origin=iframely&color=%23992222"
                        allow="autoplay"
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="soundcloud-player">
                    <iframe
                        title="Soundcloud-spelare 3"
                        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Ftanken-600428158%2Fsets%2Fgotta-get-that-disk-away-from&auto_play=false&show_artwork=true&visual=true&origin=iframely&color=%23992222"
                        allow="autoplay"
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="soundcloud-player">
                    <iframe
                        title="Soundcloud-spelare 4"
                        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fyabossobay%2Fsets%2Fdiskaids&auto_play=false&show_artwork=true&visual=true&origin=iframely&color=%23992222"
                        allow="autoplay"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <a class="footer-logo" href="index.html">
                <img src="bilder/logo.png" alt="Datalaget Logo">
            </a>
            <div class="footer-section">
                <h2>Datalaget</h2>
                <a href="arbetare.html">Vilka är vi?</a>
                <a href="soundcloud.html">Lite fin musik</a>
                <a href="https://www.instagram.com/datalaget/">Instagram</a>
            </div>
            <div class="footer-section">
                <h2>Sök data?</h2>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSeu9iYtV5-QYzNFaPluN934z_IgpMClk-NdvaX-Vu9oOt-Uog/viewform">Sök här</a>
            </div>
        </div>
    </footer>

</body>
</html>
